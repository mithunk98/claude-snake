name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Linux on purpose. `curses` is in the stdlib here but not on Windows, where
    # tests/test_tui.py cannot even be collected without the windows-curses
    # package - so a Windows-only run silently skips a third of the suite.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # The game itself has no dependencies; that is a feature worth keeping,
        # so nothing here installs runtime packages.
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      # Tests run before any auxiliary check, so a problem with a guard can
      # never skip the suite and hide whether the code actually works.
      - name: Run tests
        run: pytest tests/ -v

      - name: Confirm the game has no runtime dependencies
        # "No dependencies" is a stated feature, so assert it rather than
        # trust it - but assert it properly. This step previously diffed
        # `pip freeze` against an allowlist, which failed on 3.10 and 3.11:
        # those versions seed a new venv with setuptools and wheel, while
        # 3.12+ do not. Nothing to do with this project.
        #
        # The honest test is whether the package imports where nothing at all
        # is installed. --without-pip gives exactly that environment, and the
        # repo root as cwd is what puts `snake` on sys.path.
        #
        # It doubles as a headless-import check: there is no TTY here, so a
        # curses call at import time fails loudly in CI rather than in
        # somebody's terminal.
        run: |
          python -m venv --without-pip /tmp/bare-env
          /tmp/bare-env/bin/python -c "import snake; print('imports with zero packages installed')"
