name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Linux on purpose. `curses` is in the stdlib here but not on Windows, where
    # tests/test_tui.py cannot even be collected without the windows-curses
    # package - so a Windows-only run silently skips a third of the suite.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # The game itself has no dependencies; that is a feature worth keeping,
        # so nothing here installs runtime packages.
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Confirm the game still has no runtime dependencies
        run: |
          pip freeze --exclude pytest --exclude pip --exclude iniconfig \
            --exclude packaging --exclude pluggy --exclude Pygments \
            --exclude exceptiongroup --exclude tomli > extra.txt
          if [ -s extra.txt ]; then
            echo "Unexpected runtime dependencies appeared:"; cat extra.txt; exit 1
          fi
          echo "None, as intended."

      - name: Run tests
        run: pytest tests/ -v

      - name: Import the package without a terminal
        # Catches import-time curses calls, which would break any environment
        # that imports the module outside a real TTY.
        run: python -c "import snake; print('import OK')"
